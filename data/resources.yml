  - id: intent-centric-software-engineering
    name: From Code-Centric to Intent-Centric Software Engineering
    url: https://arxiv.org/abs/2605.11027
    category: research
    lifecycle: [capture, represent, verify, governance]
    availability: research
    maturity: research
    representation: Reflexive thematic analysis of intent, accountability, and agentic work.
    description: Examines how generative and agentic systems shift engineering attention toward intent, judgment, and accountability.
    limitation: Qualitative analysis; it does not prescribe a single implementation or data model.
